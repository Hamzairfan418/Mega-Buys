<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A09">

  <title>Mega Buys — Coming Soon</title>
  <meta name="description" content="Mega Buys is preparing a new wholesale and retail experience built around scale, value and modern commerce. Coming soon.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Mega Buys — Coming Soon">
  <meta property="og:description" content="Something bigger is on the way.">
  <meta property="og:site_name" content="Mega Buys">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script>
    document.documentElement.classList.remove('no-js');
    document.documentElement.classList.add('js');
  </script>
</head>
<body>
  <main class="launch" aria-labelledby="brand-title">
    <div class="atmosphere" aria-hidden="true">
      <div class="grid"></div>
      <div class="ambient ambient--one"></div>
      <div class="ambient ambient--two"></div>

      <div class="stack stack--primary">
        <span class="stack__panel stack__panel--back"></span>
        <span class="stack__panel stack__panel--middle"></span>
        <span class="stack__panel stack__panel--front"></span>
        <span class="stack__highlight"></span>
      </div>

      <div class="stack stack--secondary">
        <span class="stack__panel stack__panel--back"></span>
        <span class="stack__panel stack__panel--front"></span>
      </div>

      <div class="depth-line depth-line--one"></div>
      <div class="depth-line depth-line--two"></div>

      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <div class="viewport-frame" aria-hidden="true">
      <span class="dieline dieline--top-left"></span>
      <span class="dieline dieline--bottom-right"></span>
    </div>

    <p class="reference reference--top-left">RETAIL SYSTEM / 01</p>
    <p class="reference reference--top-right">LAUNCH STATUS • PREPARING</p>
    <p class="reference reference--bottom-left">BUILT FOR BETTER VALUE</p>
    <p class="reference reference--bottom-right">MEGA / 2026</p>

    <div class="barcode" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <section class="hero" aria-label="Mega Buys launch announcement">
      <div class="corner-bracket corner-bracket--left" aria-hidden="true"></div>
      <div class="corner-bracket corner-bracket--right" aria-hidden="true"></div>

      <p class="eyebrow reveal reveal--1">WHOLESALE <span>•</span> RETAIL <span>•</span> VALUE AT SCALE</p>

      <h1 class="brand-title reveal reveal--2" id="brand-title">
        <span class="brand-title__mega">Mega</span>
        <span class="brand-title__buys">Buys</span>
      </h1>

      <p class="coming-soon reveal reveal--3">Coming Soon</p>
      <p class="statement reveal reveal--4">Something bigger is on the way.</p>

      <div class="progress reveal reveal--5" aria-hidden="true">
        <p class="progress__label">PREPARING THE NEXT BIG THING</p>
        <div class="progress__track">
          <span class="progress__light"></span>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
